[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "graynet"
dynamic = ["version"]
description = "Individualized single-subject networks from T1 mri features such as cortical thickness and gray matter density. "
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Pradeep Reddy Raamana", email = "raamana@gmail.com" },
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "hiwenet",
    "medpy",
    "networkx",
    "nibabel",
    "numpy",
    "pyradigm",
    "scipy",
]

[project.optional-dependencies]
test = [
    "hypothesis",
    "pytest",
]
docs = [
    "hiwenet",
    "networkx",
    "nibabel",
    "numpy",
    "numpydoc",
    "sphinx",
    "sphinx-argparse",
    "sphinx-rtd-theme",
    "sphinx-theme-pd",
]
dev = [
    "coverage[toml]",
    "flake8",
    "graynet[docs,test]",
]

[project.urls]
Homepage = "https://github.com/raamana/graynet"

[project.scripts]
graynet = "graynet.__main__:main"

[tool.hatch.build]
include = [
    "graynet/**/*.py",
    "graynet/atlases/**/*",
    "graynet/resources/**/*",
]
exclude = [
    "graynet/tests/*",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
include = [
    "/docs",
    "/example_data",
    "/graynet",
    "/LICENSE",
    "/Makefile",
    "/README.md",
]

[tool.pytest.ini_options]
testpaths = ["graynet/tests"]
